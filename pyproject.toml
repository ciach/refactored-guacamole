[project]
name = "rag-agent"
version = "0.1.0"
description = "CLI-first hybrid RAG agent built with OpenAI, PydanticAI, Rich, and uv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=4.0.0",
  "neo4j>=5.28.2",
  "numpy>=2.3.3",
  "openai>=2.1.0",
  "pgvector>=0.4.1",
  "psycopg[binary]>=3.2.10",
  "pydantic>=2.11.0",
  "pydantic-ai>=1.0.0",
  "pydantic-settings>=2.11.0",
  "pypdf>=6.0.0",
  "python-dotenv>=1.1.1",
  "python-frontmatter>=1.1.0",
  "rich>=14.1.0",
  "sqlalchemy>=2.0.43",
  "tiktoken>=0.12.0",
  "typer>=0.19.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "ruff>=0.13.0",
]

[project.scripts]
rag-agent = "rag_agent.main:main"

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_agent"]
