[project]
name = "rag-agent"
version = "0.1.0"
description = "CLI-first RAG agent scaffold built with OpenAI, PydanticAI, Rich, and uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markdown-it-py>=3.0.0",
  "neo4j>=5.28.2",
  "numpy>=2.2.6",
  "openai>=2.0.0",
  "pydantic>=2.11.0",
  "pydantic-ai>=1.0.10",
  "pydantic-settings>=2.10.1",
  "pypdf>=5.9.0",
  "python-dotenv>=1.1.1",
  "python-frontmatter>=1.1.0",
  "rich>=14.1.0",
  "sqlalchemy>=2.0.43",
  "psycopg[binary]>=3.2.9",
  "pgvector>=0.4.1",
  "textual>=0.79.1",
  "tiktoken>=0.11.0",
  "typer>=0.16.1",
]

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.10",
]

[project.scripts]
rag-agent = "rag_agent.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
packages = ["rag_agent"]
plugins = []

